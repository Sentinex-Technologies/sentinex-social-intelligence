services:
  - type: web
    name: sentinex-api
    env: python
    region: singapore
    plan: free
    branch: main
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.14.0
      - key: DATABASE_URL
        value: sqlite:///./sentinex.db
      - key: ENVIRONMENT
        value: production
    healthCheckPath: /api/health
